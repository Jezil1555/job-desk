services:
  - type: web
    runtime: static
    name: job-desk
    buildCommand: echo "static site, nothing to build"
    staticPublishPath: ./public
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
